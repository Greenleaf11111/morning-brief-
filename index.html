<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时政晨读 · 深圳初中道法</title>
<style>
  :root{
    --brand:#e23d5a; --sub:#ff8b94; --ink:#1f2333; --muted:#7a7d94;
    --bg:#f4f6fb; --card:#ffffff; --line:#e7eaf3; --accent:#4a7cf7;
    --green:#198754; --amber:#c77700; --purple:#6f42c1;
    --shadow:0 8px 28px rgba(31,35,51,.08); --shadow-hover:0 16px 40px rgba(31,35,51,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.66;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 12% 8%,rgba(226,61,90,.06),transparent 34%),radial-gradient(circle at 90% 2%,rgba(74,124,247,.08),transparent 30%),radial-gradient(circle at 78% 95%,rgba(111,66,193,.05),transparent 36%)}
  .wrap{max-width:1320px;margin:0 auto;padding:26px 22px 140px}

  /* 顶部品牌区 */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#ffffff,#f4f7ff);padding:20px 0 16px;border-bottom:1px solid rgba(231,234,243,.9);box-shadow:0 6px 24px rgba(31,35,51,.05);backdrop-filter:blur(10px)}
  .hinner{max-width:1320px;margin:0 auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--sub));display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;box-shadow:0 8px 18px rgba(226,61,90,.28)}
  .brand h1{font-size:27px;font-weight:900;letter-spacing:.5px}
  .brand .sub{font-size:14px;color:var(--muted);font-weight:400;margin-top:2px;letter-spacing:.3px}
  .hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 17px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--sub));color:#fff;border:none}
  .btn.primary:hover{box-shadow:0 8px 20px rgba(226,61,90,.35)}
  .date-chip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:15px;color:var(--muted);font-weight:500}

  /* 分区标题 */
  .sec{display:flex;align-items:center;gap:10px;margin:32px 0 16px}
  .sec .bar{width:12px;height:26px;border-radius:7px;background:linear-gradient(180deg,var(--brand),var(--sub));box-shadow:0 3px 8px rgba(226,61,90,.25)}
  .sec.blue .bar{background:linear-gradient(180deg,var(--accent),#7d5af5);box-shadow:0 3px 8px rgba(74,124,247,.28)}
  .sec h2{font-size:23px;font-weight:900;letter-spacing:.5px}
  .sec .n{margin-left:6px;font-size:14px;color:var(--muted);font-weight:600;background:#fff;border:1px solid var(--line);padding:4px 12px;border-radius:20px}

  /* 卡片网格（外层布局：国家 / 深圳左右并列，宽幅与底部题库一致） */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.25s;position:relative}
  .card::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--sub),var(--accent));opacity:.9}
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}
  .card .img{width:100%;height:150px;object-fit:cover;border-radius:14px;background:#eef0f7;margin-bottom:14px;display:block;flex:none}
  .card.noimg .img{display:none}
  .card h3{font-size:20px;font-weight:800;line-height:1.45;margin-bottom:10px;flex:none}
  /* ③ 正文区域：完整显示，超长时卡片内部出现滚动条，双栏高度对称由下方 .car 约束 */
  .card .sum{font-size:15.5px;color:#484b63;margin-bottom:12px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px;-webkit-overflow-scrolling:touch}
  .card .sum::-webkit-scrollbar{width:5px}
  .card .sum::-webkit-scrollbar-thumb{background:#cfd5ea;border-radius:6px}
  .card .sum::-webkit-scrollbar-track{background:transparent}
  .card .tags{flex:none}
  .card .src{flex:none}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .chip{font-size:13px;border-radius:20px;padding:6px 12px;font-weight:600}
  .chip.purple{background:#f0e9ff;color:var(--purple)}
  .chip.green{background:#e8f7ef;color:var(--green)}
  .chip.amber{background:#fff6e6;color:var(--amber)}
  .chip.blue{background:#eef2ff;color:var(--accent)}
  .chip.vid{background:linear-gradient(135deg,#fff3e6,#ffe9ef);color:#d6404f;border:1px solid #ffd9e0}
  .src{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
  .src a{color:var(--accent);text-decoration:none;word-break:break-all;font-weight:600}
  .src a:hover{text-decoration:underline}

  /* 轮播（每栏独立：上下滚动播放，国家/深圳左右各自滚动） */
  .car{position:relative;height:640px;overflow:hidden;border-radius:22px}
  .car .track{display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.22,.61,.36,1)}
  .car .slide{height:640px;box-sizing:border-box}
  .car .slide .card{height:100%;box-sizing:border-box}
  .car .arrows{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);display:flex;justify-content:space-between;pointer-events:none;z-index:7;padding:0 10px}
  .car .arrow{pointer-events:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);border:1px solid var(--line);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 6px 18px rgba(31,35,51,.16);display:flex;align-items:center;justify-content:center;opacity:.92;transition:.18s;line-height:1}
  .car .arrow:hover{opacity:1;transform:scale(1.08)}
  .car .dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:7}
  .car .dot{width:9px;height:9px;border-radius:50%;background:rgba(31,35,51,.28);cursor:pointer;transition:.2s}
  .car .dot.on{background:linear-gradient(135deg,var(--accent),#7d5af5);width:24px;border-radius:6px}
  .car .cur{position:absolute;top:12px;right:14px;z-index:7;background:rgba(31,35,51,.5);color:#fff;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px}

  /* 迷你速记 */
  .memo{background:linear-gradient(135deg,#fff,#fff8f0);border:1px solid #f0e2c8;border-radius:18px;padding:18px;margin:26px 0 4px;box-shadow:var(--shadow)}
  .memo h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .memo ul{padding-left:22px;color:#5a4a2a;font-size:15.5px}
  .memo li{margin-bottom:9px}

  /* 答题区 */
  .quiz{background:linear-gradient(135deg,#fff,#f6f0ff);border:1px solid #eadcf9;border-radius:20px;padding:22px;margin-top:26px;box-shadow:var(--shadow)}
  .quiz .qt{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .quiz .qt .badge{background:linear-gradient(135deg,var(--purple),#8b5cf6);color:#fff;border-radius:10px;padding:5px 12px;font-size:12px;font-weight:700}
  .quiz .qt h2{font-size:20px;font-weight:900}
  .qblock{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}
  .qblock .qtype{font-size:13px;font-weight:800;color:#fff;padding:5px 12px;border-radius:8px;display:inline-block;margin-bottom:12px}
  .qtype.choice{background:var(--accent)} .qtype.material{background:var(--amber)} .qtype.debate{background:var(--green)}
  .qblock .mater{margin:6px 0 14px;padding:14px;background:#fafafd;border-left:4px solid #e2e6f2;border-radius:8px;font-size:15px;color:#44465e}
  .qblock .qtext{font-size:16.5px;font-weight:700;margin-bottom:14px}
  .opts{display:grid;gap:10px}
  .opt{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px 15px;font-size:15px;cursor:pointer;transition:.15s;display:flex;gap:9px;align-items:flex-start}
  .opt:hover{border-color:var(--accent);background:#f4f7ff}
  .opt.sel{border-color:var(--accent);background:#eef4ff}
  .opt .k{font-weight:800;color:var(--accent)}
  .answer textarea{width:100%;min-height:108px;border:1.5px solid var(--line);border-radius:13px;padding:13px;font-size:15px;resize:vertical;font-family:inherit;background:#fff}
  .answer textarea:focus{outline:none;border-color:var(--accent)}
  .sub-btn{background:linear-gradient(135deg,var(--brand),var(--sub));color:#fff;border:none;border-radius:13px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:.15s}
  .sub-btn:hover{box-shadow:0 8px 18px rgba(226,61,90,.35);transform:translateY(-1px)}
  .sub-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .q-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ref-btn{background:#fff;border:1.5px solid var(--accent);color:var(--accent);border-radius:13px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:.15s}
  .ref-btn:hover{background:#eef2ff;transform:translateY(-1px)}
  .refbox{margin-top:14px;padding:16px 18px;border-radius:13px;background:#f6f8ff;border:1px solid #dbe3fb;font-size:15px;animation:refIn .25s ease}
  @keyframes refIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .ref-hd{font-size:16px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .ref-sec{margin-bottom:12px}
  .ref-sec-t{font-weight:700;color:#33417a;margin-bottom:6px}
  .ref-li{color:#38406b;margin-bottom:5px;white-space:pre-wrap;line-height:1.6}
  .solo{display:flex;flex-direction:column;gap:8px}
  .solo-lv{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 13px}
  .solo-lv:nth-child(1){border-left-color:#9aa3c2}
  .solo-lv:nth-child(2){border-left-color:#6f86d6}
  .solo-lv:nth-child(3){border-left-color:#4a7cf7}
  .solo-lv:nth-child(4){border-left-color:#7d5af5}
  .solo-lv:nth-child(5){border-left-color:#b23ad6}
  .solo-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#1f2333}
  .solo-hd b{font-size:15px}
  .solo-score{background:linear-gradient(135deg,var(--accent),#7d5af5);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap}
  .solo-desc{font-size:13.5px;color:#5b6289;margin-top:5px;line-height:1.6}
  .feedback{margin-top:14px;padding:15px 18px;border-radius:13px;font-size:15px;white-space:pre-wrap;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:#ecfbf1;border:1px solid #c4ecd5;color:#0d6e3a}
  .feedback.no{background:#fff0f1;border:1px solid #f6cbd0;color:#b02a37}
  .feedback .fb-title{font-weight:800;margin-bottom:6px}

  /* 历史/空态 */
  .tip{margin:14px 0;padding:12px 16px;background:#eff6ff;border:1px solid #d3e3fd;border-radius:12px;font-size:13px;color:#2456b3}
  .loading,.empty{text-align:center;color:var(--muted);padding:50px}

  /* 对话窗 */
  .fab{position:fixed;right:24px;bottom:24px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7d5af5);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 10px 26px rgba(74,124,247,.45);z-index:50;transition:.2s}
  .fab:hover{transform:scale(1.06)}
  .chat{position:fixed;right:24px;bottom:96px;width:350px;max-width:94vw;height:460px;background:#fff;border-radius:20px;box-shadow:0 16px 50px rgba(31,35,51,.28);display:none;flex-direction:column;z-index:60;overflow:hidden;border:1px solid var(--line)}
  .chat.open{display:flex}
  .chat .hd{background:linear-gradient(135deg,var(--accent),#7d5af5);color:#fff;padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
  .chat .hd button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
  .chat .bd{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fafaff}
  .msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap;line-height:1.5}
  .msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .chat .ft{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}
  .chat .ft input{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:10px 15px;font-size:14px}
  .chat .ft input:focus{outline:none;border-color:var(--accent)}
  .chat .ft button{background:linear-gradient(135deg,var(--accent),#7d5af5);color:#fff;border:none;border-radius:22px;padding:10px 16px;cursor:pointer;font-weight:600}
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#1f2333;color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1;top:28px}
  /* 历史浮层 */
  .hist-mask{position:fixed;inset:0;background:rgba(15,18,30,.45);z-index:70;backdrop-filter:blur(2px)}
  .hist-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);max-height:72vh;background:#fff;border-radius:20px;box-shadow:0 16px 50px rgba(31,35,51,.3);z-index:71;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
  .hist-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-weight:800;font-size:18px;border-bottom:1px solid var(--line)}
  .hist-bd{overflow-y:auto;padding:12px}
  .hist-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;cursor:pointer;transition:.15s;border:1px solid transparent}
  .hist-item:hover{background:#f4f7ff;border-color:var(--line)}
  .hist-item .d{font-weight:700;font-size:15px;color:var(--ink)}
  .hist-item .t{color:var(--muted);font-size:13px;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header><div class="hinner">
  <div class="brand">
    <div class="logo">📰</div>
    <div>
      <h1>时政晨读 <span class="sub">深圳初中道德与法治</span></h1>
    </div>
  </div>
  <div class="hbtns">
    <span class="date-chip" id="dateChip">今日晨报</span>
    <button class="btn" onclick="openHistory()">🏠 历史</button>
    <button class="btn primary" onclick="refreshNews()">🔄 刷新换一批</button>
  </div>
</div></header>

<div class="wrap">
  <div class="tip">✨ 每天 7:00 更新——国家大事 + 深圳身边事，边读边学道法考点。带 <b>🏷素养</b> 标签，答题有<b>正误解析</b>，看完点「刷新」接着看下一批～</div>

  <div class="cols">
    <div>
      <div class="sec"><span class="bar"></span><h2>国家要闻</h2><span class="n" id="nCnt">0 则</span></div>
      <div class="car" id="national"></div>
    </div>
    <div>
      <div class="sec blue"><span class="bar"></span><h2>深圳要闻</h2><span class="n" id="szCnt">0 则</span></div>
      <div class="car" id="shenzhen"></div>
    </div>
  </div>

  <div class="memo" id="memo" style="display:none"></div>

  <div class="quiz" id="quizWrap">
    <div class="qt"><span class="badge">今日一道题</span><h2>巩固一下 · 答题反馈</h2></div>
    <div id="quiz" class="loading">题目加载中…</div>
  </div>
</div>

<!-- 对话窗 -->
<button class="fab" onclick="toggleChat()">🤖</button>
<div class="chat" id="chat">
  <div class="hd"><span>道法助教</span><button onclick="toggleChat()">×</button></div>
  <div class="bd" id="chatBody">
    <div class="msg bot">Hi～我是道法助教 👋 可以问我：这则新闻对应哪个考点？这道题怎么答？</div>
  </div>
  <div class="ft">
    <input id="chatInput" placeholder="输入你的问题…" onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">发送</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 历史晨报浮层 -->
<div class="hist-mask" id="histMask" style="display:none" onclick="closeHistory()"></div>
<div class="hist-panel" id="histPanel" style="display:none">
  <div class="hist-hd"><span>📚 历史晨报</span><button onclick="closeHistory()" style="background:none;border:none;font:inherit;font-size:22px;color:var(--muted);cursor:pointer;line-height:1">×</button></div>
  <div class="hist-bd" id="histList">加载中…</div>
</div>

<script>
// ===== 数据入口（纯静态版）：直接读取 data/latest.json（GitHub Pages 托管） =====
// 无需后端、无需服务器。每天由部署脚本把最新晨报写入 data/latest.json 即可自动更新。
var DATA = null;

function loadJSON(path){
  return fetch(path, {method:'GET', cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}

function renderData(){ /* 由下方 renderData 定义 */ }

// 启动：读取最新晨报数据文件；历史数据由 data/history.json 提供（见 loadHistory）
function initStatic(){
  loadJSON('data/latest.json').then(function(d){
    if(d && (d.brief_date || (d.national&&d.national.length))){
      DATA = d;
      renderData();
    } else {
      document.getElementById('national').innerHTML='<div class="empty">暂无数据</div>';
    }
  }).catch(function(){
    document.getElementById('national').innerHTML='<div class="empty">数据加载失败，请稍后刷新</div>';
  });
}

// ---- 历史晨报（读取 data/history.json + data/archive/<日期>.json）----
var HIST_CACHE = {};
function openHistory(){
  var mask=document.getElementById('histMask'), panel=document.getElementById('histPanel');
  mask.style.display='block'; panel.style.display='flex';
  var list=document.getElementById('histList'), cur=DATA?DATA.brief_date:'';
  loadJSON('data/history.json').then(function(h){
    var items=(h&&h.data)||[];
    if(!items.length){ list.innerHTML='<div class="empty">暂无历史晨报</div>'; return; }
    list.innerHTML=items.map(function(it){
      var on=cur && it.brief_date===cur;
      return '<div class="hist-item" onclick="loadArchive(\''+esc(it.brief_date)+'\')">'+
        '<span class="d">📅 '+esc(it.brief_date)+(on?' <span style="color:var(--accent)">·当前</span>':'')+'</span>'+
        '<span class="t">'+esc(it.title||'')+'</span></div>';
    }).join('');
  }).catch(function(){ list.innerHTML='<div class="empty">历史加载失败</div>'; });
}
function closeHistory(){ document.getElementById('histMask').style.display='none'; document.getElementById('histPanel').style.display='none'; }
function loadArchive(date){
  loadJSON('data/archive/'+date+'.json').then(function(d){
    if(d && (d.brief_date || (d.national&&d.national.length))){
      DATA=d; renderData(); closeHistory(); toast('已切换到 '+date+' 的历史晨报');
    } else { toast('该期内容为空'); }
  }).catch(function(){ toast('该期历史不存在'); });
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// 素养/能力/教材标签配色
function tagClass(t){t=t||''; if(t.indexOf('政治认同')>-1)return 'chip blue'; if(t.indexOf('法治观念')>-1)return 'chip purple'; if(t.indexOf('道德修养')>-1)return 'chip green'; if(t.indexOf('健全人格')>-1||t.indexOf('责任意识')>-1)return 'chip amber'; return 'chip blue';}

function renderCard(it){
  var img = it.image_url ? '<img class="img" src="'+esc(it.image_url)+'" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">' : '';
  var tags = [];
  if(it.literacy_tag) tags.push('<span class="chip '+tagClass(it.literacy_tag)+'">🏷 '+esc(it.literacy_tag)+'</span>');
  if(it.capability_tag) tags.push('<span class="chip blue">🎯 '+esc(it.capability_tag)+'</span>');
  if(it.textbook_unit) tags.push('<span class="chip green">🏫 '+esc(it.textbook_unit)+'</span>');
  if(it.video_duration) tags.push('<span class="chip vid">🎬 附短视频 '+esc(it.video_duration)+'</span>');
  var src = it.source_url ? '<span>🔗 <a href="'+esc(it.source_url)+'" target="_blank" rel="noopener">'+esc(it.source||'官方出处')+'</a></span>' : '';
  return '<div class="card'+(img?'':' noimg')+'">'+img+
    '<h3>'+esc(it.title)+'</h3>'+
    '<div class="sum">'+esc(it.summary)+'</div>'+
    '<div class="tags">'+tags.join('')+'</div>'+
    '<div class="src">'+src+'</div></div>';
}

var quizzes = [];
function buildQuiz(){
  var wrap=document.getElementById('quiz');
  if(!DATA || !DATA.questions || !DATA.questions.length){ wrap.className='empty'; wrap.innerHTML='暂无题目（动态版由智能体实时生成）'; return; }
  wrap.className=''; wrap.innerHTML='';
  quizzes=DATA.questions.map(function(q){return {index:quizzes.length, data:q, sel:null, done:false, mode:null};});
  quizzes.forEach(function(q){ wrap.appendChild(renderQ(q)); });
}
function renderQ(q){
  var d=q.data, div=document.createElement('div'); div.className='qblock'; div.dataset.i=q.index;
  var tlabel={choice:'单选题',material:'材料分析题',debate:'思辨开放题'}[d.type]||'题目';
  var typeClass=(d.type==='choice')?'choice':(d.type==='material'?'material':'debate');
  var inner='<span class="qtype '+typeClass+'">'+tlabel+'</span>';
  if(d.material) inner+='<div class="mater">📄 <b>材料：</b>'+esc(d.material)+'</div>';
  inner+='<div class="qtext">'+(q.index+1)+'. '+esc(d.question)+'</div>';
  if(d.type==='choice'){
    var opts=d.options||[];
    inner+='<div class="opts">'+opts.map(function(o,i){
      var letter=String.fromCharCode(65+i);
      return '<div class="opt" data-letter="'+letter+'" onclick="choose(this,'+q.index+')"><span class="k">'+letter+'.</span><span>'+esc(o)+'</span></div>';
    }).join('')+'</div>';
    inner+=submitBtn(q.index,'提交答案');
  }else{
    inner+='<div class="answer"><textarea id="ta'+q.index+'" placeholder="'+(d.type==='material'?'组织你的答案…（分点作答更清晰）':'谈谈你的看法，可举例子、讲道理…')+'"></textarea></div>';
    inner+='<div class="q-actions">'+submitBtn(q.index,'提交我的回答')+
      '<button class="ref-btn" onclick="toggleRef('+q.index+')">📖 查阅参考答案</button></div>';
    inner+='<div class="refbox" id="ref'+q.index+'" style="display:none"></div>';
  }
  inner+='<div class="feedback" id="fb'+q.index+'"></div>';
  div.innerHTML=inner;
  return div;
}
function submitBtn(i,txt){return '<button class="sub-btn" onclick="submitQ('+i+')">'+txt+'</button>';}
function choose(el, i){
  var q=quizzes[i]; q.sel=el.getAttribute('data-letter');
  el.parentNode.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel')});
  el.classList.add('sel');
  showFeedback(i,null,false);
}
function answerOf(q){
  if(q.data.type==='choice') return q.sel||'';
  var ta=document.getElementById('ta'+q.index); return ta?ta.value.trim():'';
}
function submitQ(i){
  var q=quizzes[i]; if(q.done) return;
  var ans=answerOf(q);
  if(q.data.type==='choice'){ if(!q.sel){toast('请先选择一个选项');return;} }
  else if(!ans){ toast('请先写下你的回答'); return; }
  q.done=true; q.ans=ans;
  var fb=document.getElementById('fb'+q.index), correct=null, title='', body='';
  if(q.data.type==='choice'){
    var right=(ans=== (q.data.answer||'')).toString();
    correct=right==='true';
    title=(correct?'✅ 回答正确！':'❌ 回答有误，正确答案是 '+esc(q.data.answer));
    body=q.data.explanation||'';
  }else{
    correct=null;
    title='📝 已记录你的回答 ✔';
    body='可点击上方「📖 查阅参考答案」查看参考答案与 SOLO 分层框架，对照自查。';
    // 自动展开参考答案框
    var rb=document.getElementById('ref'+q.index); if(rb){rb.innerHTML=refHTML(q); rb.style.display='block';}
  }
  showFeedback(i,title,correct,body);
  var b=fb.querySelector('.fb-title'); if(b){b.textContent=title;}
}
// 参考答案 + SOLO 分层框架
// 参考答案分点：兼容"分点数组" 与 "整段长字符串(①②③)"两种格式
function splitRef(r){
  var arr=[];
  if(Array.isArray(r)){ arr=r.slice(); }
  else if(r){ arr=[r]; }
  var out=[];
  for(var k=0;k<arr.length;k++){
    var item=String(arr[k]||'');
    // 若这一条里含多个"①②③"序号，拆成多条
    var parts=item.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).filter(function(s){return s.trim();});
    if(parts.length>1){ out=out.concat(parts); }
    else if(item.trim()){ out.push(item); }
  }
  // 去掉纯序号残留行
  return out.map(function(s){return s.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]+\s*/,'').trim();}).filter(Boolean);
}

function refHTML(q){
  var d=q.data, h='';
  h+='<div class="ref-hd">📖 参考答案</div>';
  if(d.reference){
    var ref=splitRef(d.reference);
    h+='<div class="ref-sec"><div class="ref-sec-t">【参考答案】</div>'+
      ref.map(function(r){return '<div class="ref-li">• '+esc(r)+'</div>';}).join('')+'</div>';
  }
  var solo=d.solo;
  if(solo){
    var levels=Array.isArray(solo)?solo:(solo.levels||[]);
    if(levels.length){
      h+='<div class="ref-sec"><div class="ref-sec-t">🧩 SOLO 分层框架（比照你的回答，看看你处在哪一层）</div>';
      h+='<div class="solo">'+levels.map(function(lv){
        var nm=lv.level||lv.name||'';
        var desc=lv.desc||lv.description||'';
        var score=lv.score!=null?('<span class="solo-score">'+esc(score)+'</span>'):'';
        return '<div class="solo-lv"><div class="solo-hd"><b>'+esc(nm)+'</b>'+score+'</div>'+(desc?'<div class="solo-desc">'+esc(desc)+'</div>':'')+'</div>';
      }).join('')+'</div>';
    }
  }
  if(d.explanation) h+='<div class="ref-sec"><div class="ref-sec-t">📌 解析</div><div class="ref-li">'+esc(d.explanation)+'</div></div>';
  return h;
}
function toggleRef(i){
  var q=quizzes[i];
  var rb=q?document.getElementById('ref'+q.index):null;
  if(!rb) return;
  if(rb.style.display==='block'){ rb.style.display='none'; return; }
  rb.innerHTML=refHTML(q);
  rb.style.display='block';
}
function showFeedback(i,title,correct,body){
  var fb=document.getElementById('fb'+qindex2(i));
  if(correct===true){fb.className='feedback ok show';}
  else if(correct===false){fb.className='feedback no show';}
  else{fb.className='feedback show';}
  if(title){ var b=document.createElement('div'); b.className='fb-title'; b.innerHTML=title; fb.innerHTML=''; fb.appendChild(b); }
  if(body){ var p=document.createElement('div'); p.innerHTML=body; fb.appendChild(p); }
}
function qindex2(i){return i;}

function renderMemo(){
  var m=document.getElementById('memo');
  if(!DATA || !DATA.quick_notes || !DATA.quick_notes.length){m.style.display='none';return;}
  m.style.display='block';
  m.innerHTML='<h2>💡 迷你速记</h2><ul>'+DATA.quick_notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ul>';
}

// ===== 卡片轮播（每栏独立，20 秒自动切换） =====
var CAR_MS = 20000;          // 20 秒自动切换
var carTimers = {};

function startCarousel(id, items){
  var box=document.getElementById(id);
  // 清理旧轮播
  if(carTimers[id]){clearInterval(carTimers[id]); delete carTimers[id];}
  box.innerHTML='';
  if(!box._car){box._car={idx:0};}
  if(!items || !items.length){ box.innerHTML='<div class="empty">暂无数据</div>'; return; }
  box._car.n=items.length; box._car.idx=0;
  var track=document.createElement('div'); track.className='track';
  items.forEach(function(it){
    var s=document.createElement('div'); s.className='slide';
    s.innerHTML=renderCard(it); track.appendChild(s);
  });
  box.appendChild(track);
  // 页码徽标
  var cur=document.createElement('div'); cur.className='cur'; cur.id=id+'Cur'; box.appendChild(cur);
  // 方向箭头
  if(items.length>1){
    var ar=document.createElement('div'); ar.className='arrows';
    ar.innerHTML='<button class="arrow" onclick="carGo(\''+id+'\',-1)">‹</button>'+
                 '<button class="arrow" onclick="carGo(\''+id+'\',1)">›</button>';
    box.appendChild(ar);
  }
  // 指示圆点
  var dots=document.createElement('div'); dots.className='dots'; dots.id=id+'Dots';
  items.forEach(function(_,i){
    var d=document.createElement('span'); d.className='dot'+(i===0?' on':'');
    d.onclick=function(){carSet(id,i);restartCar(id);};
    dots.appendChild(d);
  });
  box.appendChild(dots);
  carSet(id,0);
  carTimers[id]=setInterval(function(){carGo(id,1);},CAR_MS);
}
function carSet(id,i){
  var box=document.getElementById(id), c=box._car;
  c.idx=(i+c.n)%c.n;
  var cur=document.getElementById(id+'Cur'); if(cur) cur.textContent=(c.idx+1)+' / '+c.n;
  var dots=document.getElementById(id+'Dots');
  if(dots) Array.prototype.forEach.call(dots.children,function(d,n){d.classList.toggle('on',n===c.idx);});
  box.querySelector('.track').style.transform='translateY('+(-c.idx*box.offsetHeight)+'px)';
}
function carGo(id,step){ var box=document.getElementById(id); if(!box||!box._car||box._car.n<=1)return; carSet(id,box._car.idx+step); }
function restartCar(id){ if(carTimers[id]){clearInterval(carTimers[id]);} carTimers[id]=setInterval(function(){carGo(id,1);},CAR_MS); }
function clearCars(){ for(var k in carTimers){clearInterval(carTimers[k]); delete carTimers[k];} }

function renderData(){
  if(!DATA){ document.getElementById('national').innerHTML='<div class="empty">暂无数据</div>'; return; }
  clearCars();
  startCarousel('national', DATA.national||[]);
  startCarousel('shenzhen', DATA.shenzhen||[]);
  document.getElementById('nCnt').textContent=(DATA.national||[]).length+' 则';
  document.getElementById('szCnt').textContent=(DATA.shenzhen||[]).length+' 则';
  if(DATA.brief_date) document.getElementById('dateChip').textContent='📅 '+DATA.brief_date+' · 今日晨报';
  renderMemo(); buildQuiz();
}

// 刷新换一批（动态版对接后端重新生成；预览版做顺序滚动演示）
function refreshNews(){
  toast('🔄 正在为你换一批新闻…');
  if(DATA){
    function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
    DATA.national=shuffle(DATA.national||[]);
    DATA.shenzhen=shuffle(DATA.shenzhen||[]);
    renderData();
  }
  setTimeout(function(){toast('已切换一批新素材 ✨（动态版将实时生成新一批）');},900);
}

// 对话窗
function toggleChat(){ document.getElementById('chat').classList.toggle('open'); }
function sendChat(){
  var inp=document.getElementById('chatInput'), v=inp.value.trim(); if(!v)return;
  var bd=document.getElementById('chatBody');
  bd.insertAdjacentHTML('beforeend','<div class="msg user">'+esc(v)+'</div>');

    bd.scrollTop=bd.scrollHeight;
  },500);
  bd.scrollTop=bd.scrollHeight;
}

var toastTimer;
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.classList.remove('show')},2400); }
